name: Daily AI/ML Progress

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-progress:
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------
      # STEP 1: Checkout Repository
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5


      # ---------------------------------------
      # STEP 2: Configure Git
      # ---------------------------------------
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "216425985+Tanusree-samanta@users.noreply.github.com"


      # =======================================
      # COMMIT 1 — DAILY PROGRESS
      # =======================================
      - name: Commit 1 - Daily progress
        run: |

          DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          DAY=$(TZ=Asia/Kolkata date +%j)

          mkdir -p daily-progress

          FILE="daily-progress/day-${DAY}.md"

          if [ ! -f "$FILE" ]; then

            cat <<EOF > "$FILE"
# Day ${DAY} — ${DATE}

## What I Learned

- Add today's AI/ML topic here.

## What I Practiced

- Add today's coding/practice work here.

## Key Takeaway

- Add the most important thing learned today.

## Next Step

- Add tomorrow's learning goal.
EOF

            git add "$FILE"

            git commit -m "docs: add day ${DAY} progress log"

            git push

          else

            echo "Daily progress file already exists."

          fi


      # =======================================
      # COMMIT 2 — PRACTICE CODE
      # =======================================
      - name: Commit 2 - Practice code
        run: |

          DAY=$(TZ=Asia/Kolkata date +%j)

          mkdir -p daily-progress/practice

          FILE="daily-progress/practice/day-${DAY}-practice.py"

          if [ ! -f "$FILE" ]; then

            cat <<EOF > "$FILE"
"""
AI/ML Practice
Day ${DAY}

Add today's Python / ML practice here.
"""

# Example:
# print("Day ${DAY} AI/ML Practice")

EOF

            git add "$FILE"

            git commit -m "feat: add day ${DAY} practice"

            git push

          else

            echo "Practice file already exists."

          fi


      # =======================================
      # COMMIT 3 — NOTES
      # =======================================
      - name: Commit 3 - Notes
        run: |

          DAY=$(TZ=Asia/Kolkata date +%j)
          DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          mkdir -p daily-progress/notes

          FILE="daily-progress/notes/day-${DAY}-notes.md"

          if [ ! -f "$FILE" ]; then

            cat <<EOF > "$FILE"
# AI/ML Notes — Day ${DAY}

Date: ${DATE}

## Topic

Write today's topic here.

## Important Concepts

- Concept 1
- Concept 2
- Concept 3

## Example

Add an example here.

## Key Points

- Point 1
- Point 2
- Point 3

## Questions / Doubts

- Add questions here.

## Revision

- Review today's topic.
EOF

            git add "$FILE"

            git commit -m "docs: add day ${DAY} notes"

            git push

          else

            echo "Notes file already exists."

          fi
