name: Daily AI/ML Progress

on:
  schedule:
    # 8:00 PM IST = 2:30 PM UTC
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-progress:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================
      # CONFIGURE GIT
      # ==========================================
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "216425985+Tanusree-samanta@users.noreply.github.com"

      # ==========================================
      # COMMIT 1 — DAILY PROGRESS
      # ==========================================
      - name: Commit 1 - Daily progress
        run: |

          DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          mkdir -p daily-progress

          FILE="daily-progress/day-${DATE}.md"

          if [ ! -f "$FILE" ]; then

            printf '%s\n' \
              "# Daily AI/ML Progress — ${DATE}" \
              "" \
              "## What I Learned" \
              "" \
              "- Add today's AI/ML topic here." \
              "" \
              "## What I Practiced" \
              "" \
              "- Add today's coding/practice work here." \
              "" \
              "## Key Takeaway" \
              "" \
              "- Add the most important thing learned today." \
              "" \
              "## Next Step" \
              "" \
              "- Add tomorrow's learning goal." \
              > "$FILE"

            git add "$FILE"
            git commit -m "docs: add daily progress for ${DATE}"
            git push

          else
            echo "Daily progress file already exists."
          fi

      # ==========================================
      # COMMIT 2 — PRACTICE CODE
      # ==========================================
      - name: Commit 2 - Practice code
        run: |

          DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          mkdir -p daily-progress/practice

          FILE="daily-progress/practice/${DATE}-practice.py"

          if [ ! -f "$FILE" ]; then

            printf '%s\n' \
              '"""' \
              "AI/ML Practice - ${DATE}" \
              "" \
              "Add today's Python / AI / ML practice here." \
              '"""' \
              "" \
              "# Example:" \
              "# print(\"AI/ML Practice - ${DATE}\")" \
              > "$FILE"

            git add "$FILE"
            git commit -m "feat: add practice for ${DATE}"
            git push

          else
            echo "Practice file already exists."
          fi

      # ==========================================
      # COMMIT 3 — NOTES
      # ==========================================
      - name: Commit 3 - Notes
        run: |

          DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          mkdir -p daily-progress/notes

          FILE="daily-progress/notes/${DATE}-notes.md"

          if [ ! -f "$FILE" ]; then

            printf '%s\n' \
              "# AI/ML Notes — ${DATE}" \
              "" \
              "Date: ${DATE}" \
              "" \
              "## Topic" \
              "" \
              "Write today's topic here." \
              "" \
              "## Important Concepts" \
              "" \
              "- Concept 1" \
              "- Concept 2" \
              "- Concept 3" \
              "" \
              "## Example" \
              "" \
              "Add an example here." \
              "" \
              "## Key Points" \
              "" \
              "- Point 1" \
              "- Point 2" \
              "- Point 3" \
              "" \
              "## Questions / Doubts" \
              "" \
              "- Add questions here." \
              "" \
              "## Revision" \
              "" \
              "- Review today's topic." \
              > "$FILE"

            git add "$FILE"
            git commit -m "docs: add notes for ${DATE}"
            git push

          else
            echo "Notes file already exists."
          fi
